<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="greenCandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  
  <!-- Candlesticks -->
  <!-- Candle 1: Red -->
  <line x1="28" y1="36" x2="28" y2="84" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="22" y="44" width="12" height="28" rx="2" fill="#ef4444"/>

  <!-- Candle 2: Green -->
  <line x1="56" y1="24" x2="56" y2="92" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="50" y="36" width="12" height="42" rx="2" fill="url(#greenCandle)"/>

  <!-- Candle 3: Green -->
  <line x1="84" y1="16" x2="84" y2="76" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="78" y="24" width="12" height="34" rx="2" fill="url(#greenCandle)"/>

  <!-- Dynamic Indicator Polyline Curve -->
  <path d="M 16 72 Q 40 68 56 50 T 96 28 T 112 20" fill="none" stroke="url(#cyanLine)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Signal marker dot -->
  <circle cx="56" cy="50" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
</svg>
